events {}
http {
    server {
        listen 0.0.0.0:80;
        server_name public.example;
        access_log off;
        location /admin {
            proxy_pass http://app:8080;
        }
    }
    server {
        listen 10.20.30.40:8443 ssl;
        server_name internal.example;
        ssl_certificate /etc/nginx/tls/internal.crt;
        ssl_certificate_key /etc/nginx/tls/internal.key;
        location / {
            proxy_pass https://internal-app:8443;
            proxy_ssl_verify on;
        }
    }
}
