events {}
http {
    add_header X-Content-Type-Options nosniff always;

    server {
        listen 443 ssl;
        server_name audit.example;

        location /files {
            proxy_pass http://$arg_target;
            proxy_set_header Host $http_host;
            add_header X-Trace $arg_trace;
            alias /srv/files/;
            allow 10.0.0.0/8;
            valid_referers none server_names;
        }
    }
}
