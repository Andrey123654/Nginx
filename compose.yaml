services:
  nginx-scope:
    build:
      context: .
    image: nginx-scope:1.0.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      MAX_UPLOAD_BYTES: "5242880"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://127.0.0.1:8080}"
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
